name: Attest release assets

on:
    workflow_dispatch:
        inputs:
            tag:
                description: Release tag to attest
                required: true
                default: "0.9.6"

jobs:
    attest:
        runs-on: ubuntu-latest
        permissions:
            contents: read
            id-token: write
            attestations: write

        steps:
            - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
              with:
                  ref: ${{ inputs.tag }}
                  persist-credentials: false

            - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6.5.0
              with:
                  # Not node-version-file: this workflow checks out PAST tags, which have no .nvmrc.
                  # tests/releaseGuards.test.ts asserts this equals the major in .nvmrc.
                  node-version: 24
                  cache: "npm"

            - run: npm ci
            - run: npm run build

            - name: Attest release assets
              uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
              with:
                  subject-path: |
                      main.js
                      manifest.json
                      styles.css
